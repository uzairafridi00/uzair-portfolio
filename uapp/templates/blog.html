{% extends "base.html" %}
{% block title %}
  Blog - Uzair Afridi
{% endblock %}
{% block content %}
  <h1>Blog Posts</h1>
<a href="#">POSTS</a>
<ul>
  {% for post in posts %}
    <li>
      <a href="#">{{ post.title }}</a>
      <small>by {{ post.author }} on {{ post.created_at }}</small>
    </li>
  {% endfor %}
</ul>
{% endblock %}
