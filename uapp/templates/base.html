{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="I'm Mrinmoy,and this is my personal portfolio website..">
  <meta name="keywords" content="Mrinmoy, Mrinmoy Deka, mrinmoy ">

  <!--==================== UNICONS ====================-->
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />

  <!--==================== SWIPER CSS ====================-->
  <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}" />

  <!--==================== CSS ====================-->
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />


  <title>{% block title%} {% endblock %}</title>

  <!--==================== Favicon ====================-->
  <link rel="shortcut icon" href="{% static 'img/favicon_edited.png' %}" type="image/png">

  <!--==================== Animate on scroll CDN ====================-->
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

</head>

<body>

  <!--==================== HEADER ====================-->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="#" class="nav__logo">Mrinmoy</a>

      <div data-aos="fade-in" class="nav__menu" id="nav-menu">
        <ul class="nav__list grid">
          <li class="nav__items">
            <a href="/" class="nav__link {% if request.path == '/' %}active-link{% endif %}">
              <i class="uil uil-estate nav__icon"></i> Home
            </a>
          </li>

          <li class="nav__items">
            <a href="/#about" class="nav__link {% if request.path == '/#about' %}active-link{% endif %}">
              <i class="uil uil-user nav__icon"></i> About
            </a>
          </li>

          <li class="nav_items">
            <a href="/#skills" class="nav__link {% if request.path == '/#skills' %}active-link{% endif %}">
              <i class="uil uil-file nav__icon"></i> Skills
            </a>
          </li>

          <!-- <li class="nav__items">
                        <a href="#services" class="nav__link ">
                            <i class="uil uil-briefcase-alt nav__icon"></i> Services
                        </a>
                    </li> -->

          <li class="nav__items">
            <a href="/#portfolio" class="nav__link {% if request.path == '/#portfolio' %}active-link{% endif %}">
              <i class="uil uil-scenery nav__icon"></i> Portfolio
            </a>
          </li>

          <li class="nav__items">
            <a href="contact" class="nav__link {% if request.path == '/contact' %}active-link{% endif %}">
              <i class="uil uil-message nav__icon"></i> Contact me
            </a>
          </li>
        </ul>
        <i class="uil uil-times nav__close" id="nav-close"></i>
      </div>

      <div class="nav__btns">
        <!--Theme Change button-->
        <i class="uil uil-moon change-theme" id="theme-button"></i>

        <div class="nav__toggle" id="nav-toggle">
          <i class="uil uil-apps"></i>
        </div>
      </div>
    </nav>
  </header>

  <!--==================== MAIN ====================-->
  {% block content %}
  {% endblock %}

  <!--==================== FOOTER ====================-->
  <footer class="footer">
    <div class="footer__bg">
      <div class="footer__container container grid">
        <div>
          <h1 class="footer__title">Mrinmoy</h1>
          <span class="footer__subtitle">Frontend Developer</span>
        </div>

        <ul class="footer__links">
          <li>
            <a href="/#services" class="footer__link">Services</a>
          </li>
          <li>
            <a href="/#portfolio" class="footer__link">Portfolio</a>
          </li>
          <li>
            <a href="/contact" class="footer__link">Contactme</a>
          </li>
        </ul>

        <div class="footer__socials">
          <a href="https://www.instagram.com/mr1m0y._dev" target="_blank" class="footer__social">
            <i class="uil uil-instagram"></i></a>
          </a>

          <a href="https://github.com/mrinmoy-hex" target="_blank" class="footer__social">
            <i class="uil uil-github-alt"></i></a>
          </a>

          <a href="https://twitter.com/mrinmoy91013697" target="_blank" class="footer__social">
            <i class="uil uil-twitter-alt"></i></a>
          </a>
        </div>
      </div>
      <p class="footer__copy">&copy; 2022 Mrinmoy Deka | All Rights Reserved</p>
    </div>
  </footer>


  <!--==================== SCROLL TOP ====================-->
  <div><a href="#" class="scrollup" id="scroll-up">
      <i class="uil uil-arrow-up scrollup__icon"></i>
    </a></div>

  <!--==================== SWIPER JS ====================-->
  <script src="{% static 'js/swiper-bundle.min.js' %}"></script>

  <!--==================== MAIN JS ====================-->
  <script src="{% static 'js/main.js' %}"></script>

  <!--=================== Animated text ===============-->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    var typed = new Typed(".auto-input", {
      strings: [
        "a Web Developer",
        "an OS developer",
        "a student",
        "an UI Designer",
      ],
      typeSpeed: 100,
      backSpeed: 100,
      loop: true,
    });
  </script>

  <!--=================== Animate scroll js ===============-->
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init({
      offset: 300,
      duration: 2000
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const links = document.querySelectorAll('.nav__link');
      links.forEach(link => {
        link.addEventListener('click', function () {
          links.forEach(l => l.classList.remove('active-link'));
          this.classList.add('active-link');
        });
      });
    });
  </script>

</body>

</html>
